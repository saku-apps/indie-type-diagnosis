<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人開発タイプ診断 - あなたの開発スタイルがわかる</title>

    <!-- OGP Meta Tags -->
    <meta property="og:title" content="個人開発タイプ診断">
    <meta property="og:description" content="6つの質問であなたの個人開発タイプを診断。おすすめのプロダクトアイデアも提案します。">
    <meta property="og:type" content="website">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="個人開発タイプ診断">
    <meta name="twitter:description" content="6つの質問であなたの開発スタイルを診断！">
    <meta property="og:image" content="https://saku-apps.github.io/indie-type-diagnosis/og-image.png">
    <meta name="twitter:image" content="https://saku-apps.github.io/indie-type-diagnosis/og-image.png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="app">
        <!-- Background Effects -->
        <div class="bg-effects">
            <div class="orb orb-1"></div>
            <div class="orb orb-2"></div>
            <div class="orb orb-3"></div>
        </div>

        <!-- Start Screen -->
        <section id="start-screen" class="screen active">
            <div class="container">
                <div class="logo-badge">💻</div>
                <h1 class="title">
                    <span class="title-main">個人開発タイプ診断</span>
                </h1>
                <p class="subtitle">あなたの個人開発タイプを診断</p>
                <p class="description">
                    6つの質問に答えるだけで、<br>
                    あなたに最適な開発スタイルと<br>
                    おすすめのプロダクトアイデアがわかります
                </p>
                <button id="start-btn" class="btn btn-primary">
                    <span>診断スタート</span>
                    <svg class="btn-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M5 12h14M12 5l7 7-7 7" />
                    </svg>
                </button>
                <p class="note">約1分で完了 • 完全無料</p>
            </div>
        </section>

        <!-- Question Screen -->
        <section id="question-screen" class="screen">
            <div class="container">
                <!-- Progress Bar -->
                <div class="progress-container">
                    <div class="progress-bar">
                        <div id="progress-fill" class="progress-fill"></div>
                    </div>
                    <span id="progress-text" class="progress-text">1 / 6</span>
                </div>

                <!-- Question Area -->
                <div id="question-area" class="question-area">
                    <h2 id="question-text" class="question-text"></h2>
                    <div id="options-container" class="options-container"></div>
                </div>
            </div>
        </section>

        <!-- Result Screen -->
        <section id="result-screen" class="screen">
            <div class="container">
                <p class="result-label">あなたの個人開発タイプは...</p>

                <!-- Result Card -->
                <div id="result-card" class="result-card">
                    <div class="result-card-inner">
                        <div id="result-icon" class="result-icon"></div>
                        <h2 id="result-type" class="result-type"></h2>
                        <p id="result-catchcopy" class="result-catchcopy"></p>
                        <div class="result-divider"></div>
                        <p id="result-description" class="result-description"></p>

                        <div class="result-section">
                            <h3>💡 おすすめプロダクト</h3>
                            <ul id="result-products" class="result-products"></ul>
                        </div>

                        <div class="result-section">
                            <h3>🎯 開発スタイル</h3>
                            <p id="result-style" class="result-style"></p>
                        </div>

                        <div class="result-stats">
                            <div class="stat">
                                <span class="stat-label">スピード</span>
                                <div class="stat-bar">
                                    <div id="stat-speed" class="stat-fill"></div>
                                </div>
                            </div>
                            <div class="stat">
                                <span class="stat-label">クオリティ</span>
                                <div class="stat-bar">
                                    <div id="stat-quality" class="stat-fill"></div>
                                </div>
                            </div>
                            <div class="stat">
                                <span class="stat-label">独創性</span>
                                <div class="stat-bar">
                                    <div id="stat-creativity" class="stat-fill"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="result-card-footer">
                        <span class="footer-tag">#個人開発タイプ診断</span>
                        <span class="footer-url">個人開発タイプ診断</span>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="action-buttons">
                    <button id="share-btn" class="btn btn-share">
                        <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor">
                            <path
                                d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z" />
                        </svg>
                        <span>Xでシェアする</span>
                    </button>
                    <button id="retry-btn" class="btn btn-secondary">
                        <span>もう一度診断する</span>
                    </button>
                </div>

                <p class="share-note">結果をシェアしてフォロワーに教えよう！</p>
            </div>
        </section>
    </div>

    <!-- Scripts -->
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <script src="questions.js"></script>
    <script src="results.js"></script>
    <script src="app.js"></script>
</body>

</html>
